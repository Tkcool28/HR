name: v1.2 pruned62 aggressive challenger

on:
  push:
    branches:
      - feat/v1.2-trustworthy-rebuild
    paths:
      - 'trusted_v12/prepare_pruned62_challenger.py'
      - 'trusted_v12/train_v12_pruned62_aggressive.py'
      - 'experiments/v12_export_pruned62_predictions.py'
      - '.github/workflows/v12-pruned62-aggressive.yml'
  workflow_dispatch:

jobs:
  train-pruned62:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pandas==2.2.3' 'numpy>=1.26,<3' 'pyarrow>=16,<22' \
            'requests>=2.32,<3' 'scikit-learn>=1.5,<2' 'joblib>=1.4,<2' \
            'xgboost>=2.1,<4' 'optuna>=4,<5' 'pytest>=8,<9'

      - name: Reconstruct trusted 2015-2024 inputs
        run: |
          set -euxo pipefail
          rm -rf work
          mkdir -p work/hr_model
          tar -xzf package_bundles/v1.2_correction/00_v12_code_tests_reports.tar.gz -C work
          tar -xzf package_bundles/03_raw_pa_2015_2017.tar.gz -C work/hr_model
          tar -xzf package_bundles/04_raw_pa_2018_2020.tar.gz -C work/hr_model
          tar -xzf package_bundles/05_raw_pa_2021_2024.tar.gz -C work/hr_model
          tar -xzf package_bundles/02_bip_all.tar.gz -C work/hr_model
          tar -xzf package_bundles/01_curated_small_and_splits.tar.gz -C work/hr_model \
            data/curated/game.parquet \
            data/splits/train_ids.parquet \
            data/splits/val_ids.parquet
          test ! -e work/hr_model/data/splits/holdout_ids.parquet
          test ! -e work/hr_model/models/holdout_predictions.parquet
          cp trusted_v12/process_park_factors_trusted.py work/hr_model/src/data/process_park_factors_v12.py
          sudo mkdir -p /workspace
          sudo rm -rf /workspace/hr_model
          sudo ln -s "$GITHUB_WORKSPACE/work/hr_model" /workspace/hr_model

      - name: Rebuild trusted 73-feature source matrix
        run: |
          python trusted_v12/rebuild_v12_trusted.py
          python trusted_v12/augment_qoc_trusted.py

      - name: Materialize 62-feature challenger contract
        run: python trusted_v12/prepare_pruned62_challenger.py

      - name: Verify challenger contract and temporal source
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          root='/workspace/hr_model'
          with open(root+'/features/v1.2_pruned62/feature_list.json') as f:
              cols=json.load(f)
          assert len(cols)==62, len(cols)
          assert not any(c.startswith('pitcher_usage_') and c.endswith('_30d') for c in cols)
          assert 'batter_xwoba_on_contact_season' not in cols
          assert 'batter_xwoba_on_contact_career' not in cols
          d=pd.read_parquet(root+'/features/v1.2_trusted/game_features.parquet', columns=['year','game_pk','batter_id','game_date'])
          assert d.year.between(2015,2024).all()
          assert not d.duplicated(['game_pk','batter_id']).any()
          print('pruned62 contract PASS; 2025 NOT READ')
          PY

      - name: Aggressive 50-trial chronological Optuna training on pruned62
        run: python trusted_v12/train_v12_pruned62_aggressive.py

      - name: Export development predictions and daily ranking evidence
        run: python experiments/v12_export_pruned62_predictions.py

      - name: Print challenger metrics
        if: always()
        run: |
          if test -f /workspace/hr_model/models/v1.2_pruned62/metrics.json; then
            cat /workspace/hr_model/models/v1.2_pruned62/metrics.json
          fi
          if test -f /workspace/hr_model/models/v1.2_pruned62/daily_ranking_summary.json; then
            cat /workspace/hr_model/models/v1.2_pruned62/daily_ranking_summary.json
          fi

      - name: Upload pruned62 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v12-pruned62-aggressive-evidence
          if-no-files-found: error
          path: |
            work/hr_model/features/v1.2_pruned62/*.json
            work/hr_model/models/v1.2_pruned62/*.json
            work/hr_model/models/v1.2_pruned62/*.csv
            work/hr_model/models/v1.2_pruned62/*.parquet
            work/hr_model/models/v1.2_pruned62/*.joblib
            work/hr_model/reports/v1.2_pruned62/*.md
