name: HR model audit

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
  workflow_dispatch:

jobs:
  code-smoke:
    name: Code smoke / imports
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests features

      - name: Import dependency smoke test
        run: |
          python - <<'PY'
          import numpy, pandas, pyarrow, sklearn, joblib, xgboost, optuna, requests
          print('dependency imports: PASS')
          PY

  parquet-audit:
    name: Parquet inventory / data-backed tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Provide legacy workspace path expected by v1.1
        run: |
          sudo mkdir -p /workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace/hr_model

      - name: Materialize uploaded package bundles when present
        shell: bash
        run: |
          if [[ -d package_bundles ]] && compgen -G 'package_bundles/*.tar.gz' > /dev/null; then
            bash tools/materialize_package_bundles.sh .
          else
            echo 'No package_bundles/*.tar.gz present; continuing with repository-resident files only.'
          fi

      - name: Inventory parquet files
        run: python tools/inspect_parquet.py --root .

      - name: Check whether full packaged data is available
        id: data
        shell: bash
        run: |
          required=(
            data/curated/pa.parquet
            data/curated/game.parquet
            data/curated/roster.parquet
            data/curated/park_factors.parquet
            data/raw/bip_all.parquet
            data/splits/train_ids.parquet
            data/splits/val_ids.parquet
            data/splits/holdout_ids.parquet
            features/v1/game_features.parquet
            features/v1.1/game_features.parquet
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          if [[ "$missing" == 0 ]]; then
            echo "full_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_data=false" >> "$GITHUB_OUTPUT"
            echo "Full data-backed tests are intentionally not claimed because heavyweight packaged Parquets are absent."
          fi

      - name: Run full packaged integrity tests
        if: steps.data.outputs.full_data == 'true'
        run: |
          python tests/test_split_integrity.py
          python tests/test_bip_integrity.py
          python tests/test_no_lookahead.py
          python tests/test_calibration.py

      - name: Mark heavyweight-data limitation explicitly
        if: steps.data.outputs.full_data != 'true'
        run: |
          echo 'CODE CI PASSED, BUT FULL MODEL/DATA TESTS DID NOT RUN.'
          echo 'Upload the repackaged tar.gz files under package_bundles/ to activate reconstruction and full testing.'
