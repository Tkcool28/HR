name: CI

on:
  push:
    branches: [main, "import/**", "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: |
          find src tests -name '*.py' -print0 2>/dev/null | xargs -0 -r python -m py_compile
      - name: Import smoke check
        run: |
          python - <<'PY'
          import numpy, pandas, pyarrow, sklearn, xgboost, optuna
          print('dependency imports OK')
          PY

  historical-tests:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('data/**/*.parquet') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests when historical artifacts are present
        run: pytest -q
