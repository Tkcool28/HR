name: v1.2 reproduction audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v12-reproduction.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'v12_source_parts/**'
      - '.github/workflows/v12-reproduction.yml'
      - 'package_bundles/**'
  workflow_dispatch:

jobs:
  reproduce-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout v1.2 audit branch
        uses: actions/checkout@v4
        with:
          ref: feat/v1.2-reproduction-audit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install v1.2 build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandas==2.2.3' 'numpy>=1.26,<3' 'pyarrow>=16,<22'

      - name: Provide legacy workspace path
        run: |
          sudo mkdir -p /workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace/hr_model

      - name: Restore historical inputs from uploaded v1.1 bundles
        run: |
          set -euxo pipefail
          tar -xzf package_bundles/00_code_tests_reports.tar.gz -C .
          tar -xzf package_bundles/01_curated_small_and_splits.tar.gz -C .
          tar -xzf package_bundles/02_bip_all.tar.gz -C .
          tar -xzf package_bundles/03_raw_pa_2015_2017.tar.gz -C .
          tar -xzf package_bundles/04_raw_pa_2018_2020.tar.gz -C .
          tar -xzf package_bundles/05_raw_pa_2021_2024.tar.gz -C .

      - name: Reconstruct exact v1.2 source-only archive
        run: |
          set -euxo pipefail
          cat v12_source_parts/part00.b64 \
              v12_source_parts/part01.b64 \
              v12_source_parts/part02.b64 \
              v12_source_parts/part03.b64 \
              v12_source_parts/part04.b64 > /tmp/v12_source.b64
          base64 --decode /tmp/v12_source.b64 > /tmp/hr_model_v1.2_source_only.tar.gz
          echo '4ee198687f6a28d13c07683d44a463835404f3f1d78d1e8f7fabef21ea18a32e  /tmp/hr_model_v1.2_source_only.tar.gz' | sha256sum --check
          tar -xzf /tmp/hr_model_v1.2_source_only.tar.gz --strip-components=1 -C .
          python -m compileall -q src/data features/v1.2 tests/test_no_lookahead_v12.py

      - name: Build v1.2 PA and starter tables
        run: /usr/bin/time -v python src/data/build_pa_v12.py

      - name: Build leakage-safe v1.2 park factors
        run: /usr/bin/time -v python src/data/process_park_factors_v12.py

      - name: Build v1.2 historical feature matrix
        run: /usr/bin/time -v python features/v1.2/build_features.py

      - name: Run v1.2 temporal integrity suite
        run: python tests/test_no_lookahead_v12.py

      - name: Verify headline reproduction counts
        run: |
          python - <<'PY'
          import pandas as pd
          import pyarrow.parquet as pq
          expected = {
              'data/curated/pa_v12.parquet': 1756558,
              'data/curated/game_starters_v12.parquet': 23191,
              'features/v1.2/game_features.parquet': 479893,
          }
          for path, rows in expected.items():
              got = pq.read_metadata(path).num_rows
              assert got == rows, f'{path}: expected {rows:,}, got {got:,}'
              print(f'PASS {path}: {got:,} rows')
          f = pd.read_parquet('features/v1.2/game_features.parquet', columns=['split','game_date'])
          counts = f['split'].value_counts().to_dict()
          assert counts.get('train') == 382059, counts
          assert counts.get('val') == 97834, counts
          assert pd.to_datetime(f['game_date']).dt.year.max() == 2024
          print(f'PASS split counts: {counts}')
          print('PASS max feature year = 2024')
          PY
